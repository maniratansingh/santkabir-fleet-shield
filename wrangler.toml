name = "purvanchal-fleet-hub"
workers_dev = false
preview_urls = false
main = "src/worker.js"
compatibility_date = "2026-11-10"

routes = [
  { pattern = "fleet.mrps.in", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# The board gate lives in the Worker, so the page entry points must reach it
# before the static asset server answers.
run_worker_first = ["/", "/index.html"]

[[durable_objects.bindings]]
name = "FLEET_HUB"
class_name = "FleetHistory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PurvanchalFleetHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FleetHistory"]

# Engineered by Mani Ratan Singh (https://mrps.in | https://github.com/maniratansingh)

[observability]
enabled = true
