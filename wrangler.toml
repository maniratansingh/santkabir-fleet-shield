name = "purvanchal-fleet-hub"
workers_dev = false
preview_urls = false
main = "src/worker.js"
compatibility_date = "2026-11-10"

routes = [
  { pattern = "fleet.mrps.in", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Keep `.html` paths literal. The Worker renders /history and /history-demo
# itself, so the asset server must not 307 `/history.html` back to `/history`.
html_handling = "none"
# The board gate lives in the Worker, so the page entry points must reach it
# before the static asset server answers. History is included because a share
# must not be able to open the admin/login surface at all.
run_worker_first = [
  "/",
  "/index.html",
  "/history",
  "/history/",
  "/history.html",
  "/history-demo",
  "/history-demo/",
  "/history-demo.html",
]

[[durable_objects.bindings]]
name = "FLEET_HUB"
class_name = "FleetHistory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PurvanchalFleetHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FleetHistory"]

# Engineered by Mani Ratan Singh (https://mrps.in | https://github.com/maniratansingh)

[observability]
enabled = true
